[package]
name = "pounce"
authors = ["alex flick"]
edition = "2024"
build = "build.rs"
default-run = "pounce"

[features]
datagen = ["serde", "serde_json", "ctrlc"]

[dependencies]
anyhow = "1.0.86"
arrayvec = "0.7.4"
bitflags = "2.6.0"
clap = { version = "4.5.15", features = ["derive"] }
ctrlc = { version = "3.4.5", features = ["termination"], optional = true }
rand = { version = "0.9.0", features = ["small_rng"] }
rand_core = "0.9.2"
rustyline = "15.0.0"
serde = { version = "1.0.209", features = ["derive"], optional = true }
serde_json = { version = "1.0.128", optional = true }
thiserror = "2.0.11"

[dev-dependencies]
criterion = { version = "0.5.1", features = ["html_reports"] }

[build-dependencies]
vergen-gitcl = { version = "1.0.0", features = ["build", "cargo"] }

[[bench]]
name = "pawn_movegen"
harness = false

[profile.release]
opt-level = 3
debug = false
rpath = false
debug-assertions = false
codegen-units = 1
lto = true
panic = "abort"

[profile.profile]
inherits = "release"
debug = true
