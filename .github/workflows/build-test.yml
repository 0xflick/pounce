name: Build and Test

on:
  pull_request:
  push:
    branches:
      - "main"
      - "release/**"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Run tests
        run: cargo test --all-features

  formatting:
    name: Code Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly
          components: rustfmt
      - name: Check formatting
        uses: actions-rust-lang/rustfmt@v1

  lint:
    name: Clippy Lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy
      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  build-verification:
    name: Build Verification (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            cpu: x86-64-v2
          - target: x86_64-apple-darwin
            os: macos-13
            cpu: x86-64-v2
          - target: aarch64-apple-darwin
            os: macos-14
            cpu: apple-m1
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            cpu: x86-64-v2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.target }}-
            ${{ runner.os }}-cargo-

      - name: Build optimized binary
        shell: bash
        run: |
          export RUSTFLAGS="-C target-cpu=${{ matrix.cpu }}"
          cargo build --target ${{ matrix.target }} --release --bin pounce

      - name: Run smoke tests
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            EXT=".exe"
          else
            EXT=""
          fi

          # Test version command
          ./target/${{ matrix.target }}/release/pounce$EXT --version

          # Test UCI protocol basics
          printf "uci\nquit\n" | ./target/${{ matrix.target }}/release/pounce$EXT | head -20

          # Test bench command (quick depth)
          timeout 30s ./target/${{ matrix.target }}/release/pounce$EXT bench --depth 6 || true

  benchmark-comparison:
    name: Performance Benchmark
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout PR
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Build PR version
        run: |
          export RUSTFLAGS="-C target-cpu=x86-64-v2"
          cargo build --release --bin pounce
          cp target/release/pounce pounce-pr

      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-branch

      - name: Build main version
        run: |
          cd main-branch
          export RUSTFLAGS="-C target-cpu=x86-64-v2"
          cargo build --release --bin pounce
          cp target/release/pounce ../pounce-main

      - name: Run benchmark comparison
        run: |
          echo "## Performance Comparison" > bench-results.md
          echo "" >> bench-results.md

          echo "### Main Branch" >> bench-results.md
          echo '```' >> bench-results.md
          timeout 60s ./pounce-main bench --depth 8 2>&1 | tee -a bench-results.md || echo "Timeout or error" >> bench-results.md
          echo '```' >> bench-results.md
          echo "" >> bench-results.md

          echo "### PR Branch" >> bench-results.md
          echo '```' >> bench-results.md
          timeout 60s ./pounce-pr bench --depth 8 2>&1 | tee -a bench-results.md || echo "Timeout or error" >> bench-results.md
          echo '```' >> bench-results.md

      - name: Comment PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const benchResults = fs.readFileSync('bench-results.md', 'utf8');

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: benchResults
            });
